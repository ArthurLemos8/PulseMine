<!doctype html>
<html lang="pt-Br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conta - PulseMine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="conta.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="barra_lateral">
        <div class="logo">
          <img src="../logo/logo.png" alt="Logo PulseMine" class="logo_item" />
          <span>Pulse<span>Mine</span></span>
        </div>
        <nav class="menu">
          <a href="../dashbord/dasbord.html" class="menu_item">
            <i class="fa-solid fa-table-cells-large"></i>
            <span>Dashboard</span>
          </a>

          <a href="../alertas/alertas.html" class="menu_item">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>Alertas</span>
          </a>

          <a href="conta.html" class="menu_item ativo">
            <i class="fa-regular fa-user"></i>
            <span>Conta</span>
          </a>

          <a href="../configuracao/" class="menu_item">
            <i class="fa-solid fa-gear"></i>
            <span>Configurações</span>
          </a>
        </nav>

        <a href="../login/login.html" class="sair">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          <span>Sair</span>
        </a>
      </aside>

      <main class="conteudo">
        <header class="cabecalho">
          <h1>Conta</h1>
          <p>Gerencie suas informações pessoais</p>
        </header>

        <section class="card">
          <div class="titulo-card">
            <div class="icone-titulo">
              <i class="bi bi-person"></i>
            </div>

            <h2>Informações Pessoais</h2>
          </div>

          <div class="linha"></div>

          <form id="formConta">
            <div class="grid-campos">
              <div class="campo">
                <label for="nome">Nome Completo</label>

                <input
                  type="text"
                  id="nome"
                  name="nome"
                  placeholder="Digite seu nome completo"
                />
              </div>

              <div class="campo">
                <label for="telefone"> Telefone</label>
                <input
                  type="tel"
                  id="telefone"
                  name="telefone"
                  placeholder="(00) 0
                />
              </div>

              <div class="campo">
                <label for="email">E-mail</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Digite seu e-mail"
                />
              </div>

              <div class="campo">
                <label for="cargo">Cargo/Função</label>
                <input
                  type="text"
                  id="cargo"
                  name="cargo"
                  placeholder="Digite seu cargo ou função"
                />
              </div>
            </div>

            <div class="acoes">
              <button type="submit" class="botao-principal">
                Salvar Alterações
              </button>
            </div>

            <p class="mensagem" id="mensagemConta"></p>
          </form>
        </section>

        <section class="card card-senha">
          <div class="titulo-card">
            <div class="icone-titulo">
              <i class="bi bi-lock"></i>
            </div>
            <h1>Alterar Senha</h1>
          </div>
          <div class="linha"></div>

          <form id="formSenha">
            <div class="grid-senha">
              <div class="campo">
                <label for="senhaAtual"> Senha Atual </label>

                <div class="campo-senha">
                  <input
                    type="password"
                    id="senhaAtual"
                    placeholder="Digite sua senha atual"
                  />

                  <button
                    type="button"
                    class="olho"
                    data-target="senhaAtual"
                    aria-label="mostrar senha atual"
                  >
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>
              <div class="campo">
                <label for="novaSenha"> Nova Senha </label>

                <div class="campo-senha">
                  <input
                    type="password"
                    id="novaSenha"
                    placeholder="Digite sua nova senha"
                  />
                  <button
                    type="button"
                    class="olho"
                    data-target="novaSenha"
                    aria-label="mostrar nova senha"
                  >
                    <i class="bi bi eye"></i>
                  </button>
                </div>
              </div>

              <div class="campo">
                <label for="confirmarSenha"> confirmar Nova Senha </label>

                <div class="campo-senha">
                  <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Confirme sua nova senha"
                  />

                  <button
                    type="button"
                    class="olho"
                    data-target="confirmarSenha"
                    aria-label="Mostrar confirmação da nova senha"
                  >
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>
            </div>

            <div class="acoes acoes-senha">
              <button type="submit" class="botao-secundario">
                Atualizar Senha
              </button>
            </div>
            <p class="mensagem" id="mensagemSenha"></p>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
