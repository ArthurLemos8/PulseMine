<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - PulseMine</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="cadastro.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img src="/logo/logo.png" alt="Logo PulseMine" class="logo" />

        <h1>Pulse <span>Mine</span></h1>

        <h2>CADASTRO</h2>

        <p class="subtitulo">Crie sua conta para continuar</p>

        <form>
          <label for="nome"> Nome completo </label>

          <div class="input-box">
            <i class="bi bi-person"></i>

            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Seu nome completo"
            />
          </div>
          <small id="erroNome" class="erro"></small>

          <label for="email"> Seu email </label>

          <div class="input-box">
            <i class="bi bi-envelope"></i>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Seu email"
            />
          </div>
          <small id="erroEmail" class="erro"></small>

          <label for="senha"> Crie uma senha </label>

          <div class="input-box">
            <i class="bi bi-lock"></i>

            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Crie uma senha"
            />
            <i class="bi bi-eye olho"></i>
          </div>

          <small id="erroSenha" class="erro"></small>

          <label for="confirme-senha"> Confirme sua senha </label>

          <div class="input-box">
            <i class="bi bi-lock"></i>

            <input
              type="password"
              id="confirme-senha"
              name="confirme-senha"
              placeholder="Confirme sua senha"
            />
            <i class="bi bi-eye olho"></i>
          </div>
          <small id="erroConfirmarSenha" class="erro"></small>

          <button type="submit">CADASTRAR</button>
          <p id="mensagemSucesso" class="sucesso"></p>
        </form>

        <p class="login">
          ja possui conta?
          <a href="login.html">Fazer login</a>
        </p>
      </div>
    </div>
    <script src="cadastro.js"></script>
  </body>
</html>
