<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alertas - PulseMine</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="alertas.css" />
    <link rel="stylesheet" href="../../components/barra-lateral/menu.css" />
    <script src="../../components/barra-lateral/menu.js" defer></script>

    <link rel="stylesheet" href="../../components/tema/tema.css" />
    <script src="../../components/tema/tema.js"></script>
  </head>

  <body data-pagina="alertas">
    <div class="dashboard">
      <div id="menu-container"></div>

      <main class="alertas-container">
        <section class="cabecalho-alertas">
          <h1>Alertas</h1>
          <p>Monitore e acompanhe todos os alertas ativos do sistema</p>
        </section>

        <section class="resumo-alertas">
          <div class="card-alerta">
            <div class="icone-alerta critico">
              <i class="bi bi-bell"></i>
            </div>

            <div class="informacoes-alerta">
              <h3>Alertas Críticos</h3>
              <strong class="numero critico-texto" id="alertasCriticos"
                >3</strong
              >
              <p>Requerem atenção imediata</p>
            </div>

            <i class="bi bi-activity grafico critico-grafico"></i>
          </div>

          <div class="card-alerta">
            <div class="icone-alerta sucesso">
              <i class="bi bi-check-circle"></i>
            </div>

            <div class="informacoes-alerta">
              <h3>Total de Alertas</h3>
              <strong class="numero" id="totalAlertas">4</strong>
              <p>Todos os alertas</p>
            </div>

            <i class="bi bi-activity grafico sucesso-grafico"></i>
          </div>
        </section>

        <section class="filtros-alertas">
          <div class="campo-pesquisa">
            <i class="bi bi-search"></i>
            <input
              type="text"
              id="buscarAlertas"
              placeholder="Buscar alertas..."
              autocomplete="off"
              aria-label="Buscar alertas"
            />
          </div>

          <div class="campo-filtro">
            <i class="bi bi-funnel"></i>
            <select id="filtronivel" aria-label="Filtrar por nível">
              <option value="todos">Todos</option>
              <option value="critico">Crítico</option>
              <option value="aviso">Aviso</option>
              <option value="normal">Normal</option>
            </select>
          </div>

          <button id="btnExcluirTodos" class="btn-excluir-todos" type="button">
            <i class="bi bi-trash"></i>
            Excluir todos
          </button>
        </section>

        <section class="lista-alertas">
          <div class="cabecalho-tabela">
            <span>NÍVEL</span>
            <span>MENSAGEM</span>
            <span>VALOR</span>
            <span>SENSOR</span>
            <span>HORA</span>
            <span></span>
          </div>

          <p id="estadoAlertas" class="nenhum-alerta">
            Aguardando conexão com o servidor.
          </p>

          <div id="listaAlertasDados"></div>
        </section>
      </main>
    </div>
    <script src="../../services/config.js"></script>
    <script src="../../services/api.js"></script>
    <script src="../../services/alertasService.js"></script>
    <script src="alertas.js"></script>
    <script src="../sair/sair.js"></script>
  </body>
</html>
